[tool.poetry]
name = "LightAutoML"
version = "0.4.2"
description = "Fast and customizable framework for automatic ML model creation (AutoML)"
authors = [
    "Alexander Ryzhkov <alexmryzhkov@gmail.com>",
    "Anton Vakhrushev <btbpanda@gmail.com>",
    "Dmitrii Simakov <dmitryevsimakov@gmail.com>",
    "Rinchin Damdinov <damdinovr@gmail.com>",
    "Alexander Kirilin <adkirilin@gmail.com>",
    "Vasilii Bunakov <va.bunakov@gmail.com>",
]
readme = "README.md"
license = "Apache-2.0"
homepage = "https://lightautoml.readthedocs.io/en/latest/"
repository = "https://github.com/sb-ai-lab/LightAutoML"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]


[tool.poetry.dependencies]
python = ">=3.10,<4.0"

pandas = [
    {version = "*"},
    # Woodwork 0.31 relies on cached DataFrame accessors, removed in pandas 3.
    {version = ">=2.0,<3", markers = "extra == 'afg' or extra == 'all'"},
]
numpy = ">=1.22"
scipy = "*"
scikit-learn = ">=0.22"
lightgbm = [
    {version = ">=2.3"},
    {version = "^4.4.0", platform = "darwin"}, # https://github.com/microsoft/LightGBM/issues/5328#issuecomment-2169128216
]
catboost = ">=0.26.1"
xgboost = ">=2.0,<4.0"
optuna = "*"
torch = ">=1.9.0"
holidays = "*"
statsmodels = ">=0.14,<0.16"
networkx = "*"
cmaes = "*"
pyyaml = "*"
tqdm = "*"
joblib = "*"
autowoe = ">=1.4.0"
jinja2 = "*"
seaborn = "*"
SQLAlchemy = ">=2.0"
tabm = "*"


tabicl = ">=2.0,<3.0"

# NLP
fasttext-numpy2 = {version = "*", optional = true}
nltk = {version = "*", optional = true}
transformers = {version = ">=4", optional = true}

# CV
albumentations = {version = ">=1.0.3,<3.0", optional = true}
timm = {version = ">=0.9.0", optional = true}
opencv-python = {version = ">=4.8.0.74,<6.0", optional = true}
PyWavelets = {version = "*", optional = true}
scikit-image = {version = "*", optional = true}
torchvision = {version = "*", optional = true}

# AFG
featuretools = {version = ">=1.11.1", optional = true}
# Woodwork 0.31 still imports pkg_resources, removed in setuptools 82.
setuptools = {version = "<82", optional = true}

# Report (pdf)
weasyprint = {version = ">=52.5,<71", optional = true}
cffi = {version = ">=1.14.5,<3.0", optional = true}

# HypEx
hypex = {version = "*", optional = true, python = "<3.14"}


[tool.poetry.extras]
cv = [
    "albumentations",
    "timm",
    "opencv-python",
    "PyWavelets",
    "scikit-image",
    "torchvision"
]
nlp = [
    "fasttext-numpy2",
    "nltk",
    "transformers"
]
report = [
    "cffi",
    "weasyprint"
]

afg = [
    "featuretools",
    "setuptools"
]

hypex = [
    "hypex",
]

all = [
    "albumentations",
    "timm",
    "opencv-python",
    "PyWavelets",
    "scikit-image",
    "torchvision",
    "fasttext-numpy2",
    "nltk",
    "transformers",
    "cffi",
    "weasyprint",
    "featuretools",
    "setuptools",
]


[build-system]
requires = ["poetry-core>=1.0.0,<3.0"]
build-backend = "poetry.core.masonry.api"


[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | tests/.*/setup.py
)/
'''

[tool.isort]
profile = "black"
force_single_line = true
atomic = true
include_trailing_comma = true
lines_after_imports = 2
lines_between_types = 1
use_parentheses = true
filter_files = true

[tool.codespell]
skip = '*.ipynb'
ignore-words-list = 'LAMA,MAPE,mape,splitted,fpr'
