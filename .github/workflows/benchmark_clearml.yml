name: ClearML benchmark

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset name (empty to select from the dataset project)"
        type: string
        required: false
      dataset_project:
        description: "ClearML project containing the datasets"
        type: string
        default: Datasets_with_metadata
        required: true
      n_datasets:
        description: "Number of random datasets (-1 for all; ignored when dataset is set)"
        type: number
        default: 5
        required: true
      project:
        description: "ClearML project for benchmark tasks"
        type: string
        default: LightAutoML
        required: true
      queue:
        description: "ClearML Agent queue"
        type: string
        default: cpu_queue
        required: true
      image:
        description: "Docker image available to the ClearML Agent"
        type: string
        default: for_clearml:3.12
        required: true
      cpu_limit:
        description: "CPU limit per task"
        type: number
        default: 8
        required: true
      memory_limit:
        description: "Memory limit per task in GB"
        type: number
        default: 16
        required: true
      save_model:
        description: "Save trained models"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    name: Enqueue benchmark in ClearML
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install submission dependencies
        run: python -m pip install clearml pandas numpy

      - name: Submit benchmark tasks
        env:
          CLEARML_API_HOST: ${{ vars.CLEARML_API_HOST }}
          CLEARML_WEB_HOST: ${{ vars.CLEARML_WEB_HOST }}
          CLEARML_FILES_HOST: ${{ vars.CLEARML_FILES_HOST }}
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
          BENCHMARK_DATASET: ${{ inputs.dataset }}
          BENCHMARK_DATASET_PROJECT: ${{ inputs.dataset_project }}
          BENCHMARK_N_DATASETS: ${{ inputs.n_datasets }}
          BENCHMARK_PROJECT: ${{ inputs.project }}
          BENCHMARK_QUEUE: ${{ inputs.queue }}
          BENCHMARK_IMAGE: ${{ inputs.image }}
          BENCHMARK_CPU_LIMIT: ${{ inputs.cpu_limit }}
          BENCHMARK_MEMORY_LIMIT: ${{ inputs.memory_limit }}
          BENCHMARK_SAVE_MODEL: ${{ inputs.save_model }}
        shell: bash
        run: |
          for setting in CLEARML_API_HOST CLEARML_WEB_HOST CLEARML_FILES_HOST CLEARML_API_ACCESS_KEY CLEARML_API_SECRET_KEY; do
            if [[ -z "${!setting}" ]]; then
              echo "::error::Missing repository variable or secret: $setting"
              exit 1
            fi
          done

          args=(
            --name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --repo="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            --branch="$GITHUB_REF_NAME"
            --commit="$GITHUB_SHA"
            --dataset_project="$BENCHMARK_DATASET_PROJECT"
            --n_datasets="$BENCHMARK_N_DATASETS"
            --project="$BENCHMARK_PROJECT"
            --queue="$BENCHMARK_QUEUE"
            --image="$BENCHMARK_IMAGE"
            --cpu_limit="$BENCHMARK_CPU_LIMIT"
            --memory_limit="$BENCHMARK_MEMORY_LIMIT"
          )
          if [[ -n "$BENCHMARK_DATASET" ]]; then
            args+=(--dataset="$BENCHMARK_DATASET")
          fi
          if [[ "$BENCHMARK_SAVE_MODEL" == true ]]; then
            args+=(--save_model)
          fi
          python scripts/experiments/run.py "${args[@]}"

          {
            echo "Benchmark tasks submitted to ClearML."
            echo "Commit: $GITHUB_SHA"
            echo "Task prefix: github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            echo "Training status and metrics are available in the ClearML Web UI."
          } >> "$GITHUB_STEP_SUMMARY"
